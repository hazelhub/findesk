name: 데이터 수집 및 배포

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # 한국은행 지표·금융위 보도자료 갱신: 2시간마다 (예약 실행은 늦어질 수 있음)
    # 브리핑은 편집기에서 게시하면(push) 바로 배포됩니다.
    - cron: "17 */2 * * *"
    # 섹터별 뉴스 온도: 오전판(07시대)·오후판(16시대) 한국시간
    - cron: "5 22 * * *"
    - cron: "5 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: 섹터별 뉴스 온도 (오전·오후 하루 한 번씩)
        run: python scripts/build_news.py

      - name: 뉴스 온도 저장 (다음 실행에서도 유지)
        run: |
          if [ -n "$(git status --porcelain data/news.json)" ]; then
            git config user.name "findesk-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -q -m "뉴스 온도 갱신"
            git pull -q --rebase origin main && git push -q origin HEAD:main || echo "저장 실패 - 다음 실행에서 다시 만듭니다"
          fi

      - name: 데이터 수집
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/update_data.py

      - name: 검색 노출 파일 생성 (사이트맵·robots·메타태그)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_seo.py

      - name: 배포 파일 준비
        run: |
          mkdir -p _site
          cp -r index.html sites.html books.html editor.html editor-books.html assets data robots.txt _site/
          [ -f sitemap.xml ] && cp sitemap.xml _site/ || true
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
